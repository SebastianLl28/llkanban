id          = "sebastianll28/llkanban"
name        = "Kanban"
version     = "0.2.1"
plugin_api  = 38   # ui.markdown (21), relative require (22), dragSource onClick/grabCursor (38)
author      = "sebastianll28"
license     = "MIT"
icon        = "layout-kanban"
description = "Kanban board with workspaces, custom columns, subtasks and markdown details."
tags        = ["productivity", "utility", "bar", "panel"]

[[setting]]
key             = "force_delete"
type            = "bool"
label_key       = "settings.force_delete.label"
description_key = "settings.force_delete.description"
default         = false

[[widget]]
id    = "toggle"
entry = "widget.luau"

[[panel]]
id    = "board"
entry = "panel.luau"
width = 1000
height = 480
placement = "attached"
position = "auto"
open_near_click = true
